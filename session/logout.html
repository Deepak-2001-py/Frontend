<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradeAnt | Log Out</title>
  <link rel="stylesheet" href="session.css">
  <script src="../javascript/api-cache.js"></script>
</head>
<body class="state-page state-page--scrim">
  <main class="state-main">
    <div class="modal-card">
      <div class="modal-avatar"></div>
      <div class="state-title state-title--lg">Log out of GradeAnt?</div>
      <p class="state-text">You'll need to sign in again to access your dashboard.</p>
      <div class="state-actions state-actions--row">
        <button type="button" class="state-btn state-btn--secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="state-btn state-btn--primary" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('cancelBtn').addEventListener('click', function () {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = '../index.html';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      ['authToken', 'userId', 'userType', 'userName', 'userData', 'loginTime'].forEach(function (key) {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
      });
      apiCache.clearAll();
      window.location.href = '../auth/login.html';
    });
  </script>
</body>
</html>
