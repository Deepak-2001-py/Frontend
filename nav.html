
<style>
  :root {
    /* ---- Brand: Orange (primary / hero) ---- */
    --orange-50:  #FFF4EC;
    --orange-100: #FFE6D2;
    --orange-200: #FFC9A1;
    --orange-300: #FFA869;
    --orange-400: #FF8A38;
    --orange-500: #FF7A00;
    --orange-600: #EC5E00;
    --orange-700: #C44A02;
    --orange-800: #973807;
    --orange-900: #7A2F0A;

    /* ---- Growth: Teal ---- */
    --teal-50:  #E7FBF5;
    --teal-100: #C4F4E8;
    --teal-200: #8DE8D3;
    --teal-300: #51D7BB;
    --teal-400: #20C0A3;
    --teal-500: #12A88E;
    --teal-600: #0C8B76;
    --teal-700: #0B6F60;
    --teal-800: #0B5A4E;
    --teal-900: #093F38;

    /* ---- Support: Sky ---- */
    --sky-50:  #EAF4FE;
    --sky-100: #D0E7FD;
    --sky-300: #7FB6F2;
    --sky-500: #4A90E2;
    --sky-600: #2F73C4;
    --sky-700: #235AA0;

    /* ---- Warm neutral (ink) ---- */
    --ink-900: #1C1813;
    --ink-800: #2B261E;
    --ink-700: #423B30;
    --ink-600: #5C5446;
    --ink-500: #7C7263;
    --ink-400: #A39A89;
    --ink-300: #C8C0B1;
    --ink-200: #E5DFD3;
    --ink-150: #EEE8DD;
    --ink-100: #F5F0E7;
    --ink-50:  #FAF6EF;
    --white:   #FFFFFF;

    /* ---- Semantic status ---- */
    --color-success: #12A88E;
    --color-success-soft: #E7FBF5;
    --color-warning: #F5A623;
    --color-warning-soft: #FFF3E0;
    --color-danger:  #E5484D;
    --color-danger-soft: #FDECEC;
    --color-info:    #4A90E2;
    --color-info-soft: #EAF4FE;

    /* Semantic aliases */
    --brand:        var(--orange-500);
    --brand-hover:  var(--orange-600);
    --brand-press:  var(--orange-700);
    --brand-soft:   var(--orange-50);
    --brand-on:     var(--white);
    --accent:       var(--teal-500);
    --accent-hover: var(--teal-600);
    --accent-soft:  var(--teal-50);
    --gradient-brand: linear-gradient(120deg, var(--orange-500) 0%, var(--orange-400) 38%, var(--teal-500) 100%);

    --text-strong: var(--ink-900);
    --text-body:   var(--ink-700);
    --text-muted:  var(--ink-500);
    --text-subtle: var(--ink-400);
    --text-on-brand: var(--white);
    --text-link:   var(--orange-600);

    --surface-page:   var(--ink-50);
    --surface-card:   var(--white);
    --surface-sunken: var(--ink-100);
    --surface-inverse: var(--ink-900);

    --border-subtle:  var(--ink-150);
    --border-default: var(--ink-200);
    --border-strong:  var(--ink-300);

    /* Typography */
    --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-sans:    'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    /* Spacing / radius / shadow */
    --radius-xs: 6px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-full: 999px;
    --shadow-sm: 0 2px 6px rgba(43, 33, 20, 0.07), 0 1px 2px rgba(43, 33, 20, 0.05);
    --shadow-md: 0 6px 16px rgba(43, 33, 20, 0.08), 0 2px 4px rgba(43, 33, 20, 0.05);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast: 0.16s;
    --dur-base: 0.24s;
  }

  #nav, #nav * { box-sizing: border-box; }

  .app-sidebar {
    width: 232px;
    flex-shrink: 0;
    min-height: 100vh;
    background: var(--ink-900);
    position: sticky;
    top: 0;
    align-self: flex-start;
    font-family: var(--font-sans);
  }

  .sidebar-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
    padding: 20px 14px;
    gap: 6px;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 18px;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 10px;
  }

  .sidebar-logo .logo-mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--gradient-brand);
    flex-shrink: 0;
  }

  .sidebar-logo .logo-word {
    color: var(--white);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 17px;
  }

  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--white);
    font-size: 22px;
    cursor: pointer;
  }

  .nav-links {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-links a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    color: var(--ink-300);
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }

  .nav-links a:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--white);
  }

  .nav-links a.active {
    background: rgba(255, 122, 0, 0.18);
    color: var(--white);
    font-weight: 600;
  }

  .nav-links a.active::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--brand);
    flex-shrink: 0;
  }

  .user-dropdown {
    position: relative;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .user-dropdown-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
  }

  .user-dropdown-toggle:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .user-dropdown-toggle .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
  }

  .user-dropdown-toggle .user-info {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    min-width: 0;
  }

  .user-dropdown-toggle .user-name {
    color: var(--white);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-dropdown-toggle .user-role {
    color: var(--ink-400);
    font-size: 11px;
  }

  .user-dropdown-toggle .material-icons {
    margin-left: auto;
    color: var(--ink-400);
    font-size: 20px;
  }

  .dropdown-menu {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin-bottom: 8px;
    background: var(--white);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    padding: 6px;
    display: none;
    z-index: 110;
  }

  .dropdown-menu.show {
    display: block;
  }

  .dropdown-menu a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-xs);
    color: var(--text-body);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background var(--dur-fast) var(--ease-out);
  }

  .dropdown-menu a:hover {
    background: var(--surface-sunken);
    color: var(--brand);
  }

  .dropdown-menu a .material-icons {
    font-size: 18px;
    color: var(--text-muted);
  }

  .dropdown-menu .dropdown-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 4px 2px;
  }

  @media (max-width: 900px) {
    .app-sidebar {
      width: 100%;
      min-height: auto;
      position: relative;
    }

    .sidebar-inner {
      min-height: auto;
      padding: 12px 16px;
    }

    .sidebar-logo {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
      flex: 1;
    }

    .mobile-menu-btn {
      display: block;
    }

    .nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--ink-900);
      padding: 10px 16px 16px;
      display: none;
      z-index: 90;
    }

    .nav-links.active {
      display: flex;
    }

    .user-dropdown {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 210px;
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .dropdown-menu {
      bottom: auto;
      top: 100%;
      margin-bottom: 0;
      margin-top: 8px;
    }
  }
</style>

<aside class="app-sidebar" id="teacherNavbar" style="display: none;">
  <div class="sidebar-inner">
    <a href="../index.html" class="sidebar-logo">
      <span class="logo-mark"></span>
      <span class="logo-word">GradeAnt</span>
    </a>
    <button class="mobile-menu-btn" id="teacherMobileMenuBtn">
      <span class="material-icons">menu</span>
    </button>
    <nav class="nav-links" id="teacherNavLinks">
      <a href="../dashboards/teacher_dashboard.html" id="teacher-nav-dashboard">Dashboard</a>
      <a href="../teacher/teacher_upload.html" id="teacher-nav-upload">Assignments</a>
      <a href="../teacher/teacher_view_grade.html" id="teacher-nav-grades">Students Grades</a>

      </div>
      <div class="dropdown-menu" id="teacherUserDropdownMenu">
        <a href="../userProfiles/teacher_profile.html">
          <span class="material-icons">person</span>
          My Profile
        </a>
        <a href="../teacher_settings.html">
          <span class="material-icons">settings</span>
          Settings
        </a>
        <div class="dropdown-divider"></div>
        <a href="#" id="teacherLogoutBtn">
          <span class="material-icons">logout</span>
          Logout
        </a>
      </div>
    </div>
  </div>
</aside>

<script>
  (function() {
    // Get user data from storage
    const userType = localStorage.getItem('userType') || sessionStorage.getItem('userType') || 'student';
    const userName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || 'User';

    // Set user name in navigation
    const studentUserNameElement = document.getElementById('userName');
    const teacherUserNameElement = document.getElementById('teacherUserName');

    if (studentUserNameElement) {
      studentUserNameElement.textContent = userName;
    }

    if (teacherUserNameElement) {
      teacherUserNameElement.textContent = userName;
    }

    // Sidebar visibility based on user type
    const studentNavbar = document.getElementById('studentNavbar');
    const teacherNavbar = document.getElementById('teacherNavbar');

    if (userType === 'teacher') {
      if (teacherNavbar) teacherNavbar.style.display = 'block';
      if (studentNavbar) studentNavbar.style.display = 'none';
    } else {
      if (studentNavbar) studentNavbar.style.display = 'block';
      if (teacherNavbar) teacherNavbar.style.display = 'none';
    }

    // Utility: Toggle menu class
    function toggleMenu(btnId, menuId) {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);
      if (btn && menu) {
        btn.addEventListener('click', function() {
          menu.classList.toggle('active');
        });
      }
    }

    // Utility: Toggle dropdown menu
    function toggleDropdown(toggleId, menuId) {
      const toggle = document.getElementById(toggleId);
      const menu = document.getElementById(menuId);
      if (toggle && menu) {
        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          menu.classList.toggle('show');
        });
      }
    }

    // Utility: Logout logic — routes through the logout confirmation state
    function setupLogout(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          window.location.href = '../session/logout.html';
        });
      }
    }

    // Enhanced function to set active nav items
    function setActiveNavItem() {
      // First remove any existing active classes from all nav links
      const allNavLinks = document.querySelectorAll('.nav-links a');
      allNavLinks.forEach(link => link.classList.remove('active'));

      // Get current path
      const path = window.location.pathname.toLowerCase();

      // Define navigation mappings with patterns matching the actual file structure
      const navMappings = {
        student: [
          { patterns: ['dashboards/student_dashboard_', 'dashboard', 'index.html', '/'], id: 'student-nav-dashboard' },
          { patterns: ['student/student_upload.html', 'student_upload', 'student_answer_correction'], id: 'student-nav-upload' },
          { patterns: ['student/student_grade.html', 'student_grade'], id: 'student-nav-grades' }
        ],
        teacher: [
          { patterns: ['dashboards/teacher_dashboard', 'dashboard', 'index.html', '/'], id: 'teacher-nav-dashboard' },
          { patterns: ['teacher/teacher_upload.html', 'teacher_upload', 'teacher_question_correction'], id: 'teacher-nav-upload' },
          { patterns: ['teacher/teacher_view_grade.html', 'teacher_view_grade'], id: 'teacher-nav-grades' },
          { patterns: ['teacher/teacher_correction.html', 'teacher_correction'], id: 'teacher-nav-correction' }
        ]
      };

      // Get user type from storage
      const userType = localStorage.getItem('userType') || sessionStorage.getItem('userType') || 'student';

      // Apply active class based on current URL
      const userNavMappings = navMappings[userType] || navMappings.student;

      // Check if any pattern matches the current path
      userNavMappings.forEach(mapping => {
        const matchesPattern = mapping.patterns.some(pattern => path.includes(pattern));
        if (matchesPattern) {
          const element = document.getElementById(mapping.id);
          if (element) {
            element.classList.add('active');
          }
        }
      });
    }

    // Add click event listeners to nav links to set active class
    function setupNavLinkHighlighting() {
      // Get all navigation links
      const studentNavLinks = document.querySelectorAll('#studentNavbar .nav-links a');
      const teacherNavLinks = document.querySelectorAll('#teacherNavbar .nav-links a');

      // Function to handle navigation link clicks
      function handleNavLinkClick(e) {
        // Remove active class from all links in the same sidebar
        const parentSidebar = e.target.closest('.app-sidebar');
        const navLinks = parentSidebar.querySelectorAll('.nav-links a');
        navLinks.forEach(link => link.classList.remove('active'));

        // Add active class to clicked link
        e.target.classList.add('active');

        // Store active link in sessionStorage for persistence
        sessionStorage.setItem('activeNavLink', e.target.id);
      }

      // Add click event listeners to all nav links
      studentNavLinks.forEach(link => {
        link.addEventListener('click', handleNavLinkClick);
      });

      teacherNavLinks.forEach(link => {
        link.addEventListener('click', handleNavLinkClick);
      });

      // Check if there's a stored active link from previous page
      const activeNavLinkId = sessionStorage.getItem('activeNavLink');
      if (activeNavLinkId) {
        const activeLink = document.getElementById(activeNavLinkId);
        if (activeLink) {
          // Remove active class from all links in the same sidebar
          const parentSidebar = activeLink.closest('.app-sidebar');
          if (parentSidebar) {
            const navLinks = parentSidebar.querySelectorAll('.nav-links a');
            navLinks.forEach(link => link.classList.remove('active'));

            // Add active class to the stored active link
            activeLink.classList.add('active');
          }
        }
      }
    }

    // Check for authentication
    function checkAuthentication() {
      const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
      if (!token) {
        // No token found — show the session-expired state rather than a silent redirect
        window.location.href = '../session/session-expired.html?returnTo=' + encodeURIComponent(window.location.pathname);
      }
    }

    // Run authentication check if not on login or signup pages
    const path = window.location.pathname.toLowerCase();
    if (!path.includes('/auth/') && !path.includes('index.html')) {
      checkAuthentication();
    }

    // Attach event handlers
    toggleMenu('mobileMenuBtn', 'navLinks');
    toggleMenu('teacherMobileMenuBtn', 'teacherNavLinks');
    toggleDropdown('userDropdownToggle', 'userDropdownMenu');
    toggleDropdown('teacherUserDropdownToggle', 'teacherUserDropdownMenu');
    setupLogout('logoutBtn');
    setupLogout('teacherLogoutBtn');

    // Close dropdowns on outside click
    document.addEventListener('click', function() {
      const studentDropdown = document.getElementById('userDropdownMenu');
      const teacherDropdown = document.getElementById('teacherUserDropdownMenu');
      if (studentDropdown) studentDropdown.classList.remove('show');
      if (teacherDropdown) teacherDropdown.classList.remove('show');
    });

    // Check if we're on a dashboard page in the dashboards folder
    const isDashboardPage = window.location.pathname.includes('/dashboards/');

    // If we're on a specific dashboard page, make sure the corresponding nav link is active
    if (isDashboardPage) {
      if (window.location.pathname.includes('student_dashboard_')) {
        const dashboardLink = document.getElementById('student-nav-dashboard');
        if (dashboardLink) {
          const allNavLinks = document.querySelectorAll('#studentNavbar .nav-links a');
          allNavLinks.forEach(link => link.classList.remove('active'));
          dashboardLink.classList.add('active');
          sessionStorage.setItem('activeNavLink', 'student-nav-dashboard');
        }
      } else if (window.location.pathname.includes('teacher_dashboard')) {
        const dashboardLink = document.getElementById('teacher-nav-dashboard');
        if (dashboardLink) {
          const allNavLinks = document.querySelectorAll('#teacherNavbar .nav-links a');
          allNavLinks.forEach(link => link.classList.remove('active'));
          dashboardLink.classList.add('active');
          sessionStorage.setItem('activeNavLink', 'teacher-nav-dashboard');
        }
      }
    } else {
      // Set active navigation item based on URL for non-dashboard pages
      setActiveNavItem();
    }

    // Set up click handling for nav links
    setupNavLinkHighlighting();
  })();
</script>
