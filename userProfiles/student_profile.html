<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | GradeAnt</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="../component-loader.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      /* ---- Brand: Orange (primary / hero) ---- */
      --orange-50:  #FFF4EC;
      --orange-100: #FFE6D2;
      --orange-200: #FFC9A1;
      --orange-300: #FFA869;
      --orange-400: #FF8A38;
      --orange-500: #FF7A00;
      --orange-600: #EC5E00;
      --orange-700: #C44A02;
      --orange-800: #973807;
      --orange-900: #7A2F0A;

      /* ---- Growth: Teal ---- */
      --teal-50:  #E7FBF5;
      --teal-100: #C4F4E8;
      --teal-200: #8DE8D3;
      --teal-300: #51D7BB;
      --teal-400: #20C0A3;
      --teal-500: #12A88E;
      --teal-600: #0C8B76;
      --teal-700: #0B6F60;
      --teal-800: #0B5A4E;
      --teal-900: #093F38;

      /* ---- Support: Sky ---- */
      --sky-50:  #EAF4FE;
      --sky-100: #D0E7FD;
      --sky-300: #7FB6F2;
      --sky-500: #4A90E2;
      --sky-600: #2F73C4;
      --sky-700: #235AA0;

      /* ---- Warm neutral (ink) ---- */
      --ink-900: #1C1813;
      --ink-800: #2B261E;
      --ink-700: #423B30;
      --ink-600: #5C5446;
      --ink-500: #7C7263;
      --ink-400: #A39A89;
      --ink-300: #C8C0B1;
      --ink-200: #E5DFD3;
      --ink-150: #EEE8DD;
      --ink-100: #F5F0E7;
      --ink-50:  #FAF6EF;
      --white:   #FFFFFF;

      /* ---- Semantic status ---- */
      --color-success: #12A88E;
      --color-success-soft: #E7FBF5;
      --color-warning: #F5A623;
      --color-warning-soft: #FFF3E0;
      --color-danger:  #E5484D;
      --color-danger-soft: #FDECEC;
      --color-info:    #4A90E2;
      --color-info-soft: #EAF4FE;

      /* ---- Grade scale ---- */
      --grade-a: #0C8B76;
      --grade-b: #2F73C4;
      --grade-c: #C98A00;
      --grade-d: #EC5E00;
      --grade-f: #E5484D;

      /* ---- Semantic aliases ---- */
      --brand:        var(--orange-500);
      --brand-hover:  var(--orange-600);
      --brand-press:  var(--orange-700);
      --brand-soft:   var(--orange-50);
      --brand-on:     var(--white);
      --accent:       var(--teal-500);
      --accent-hover: var(--teal-600);
      --accent-soft:  var(--teal-50);

      --gradient-brand: linear-gradient(120deg, var(--orange-500) 0%, var(--orange-400) 38%, var(--teal-500) 100%);
      --gradient-warm:  linear-gradient(135deg, var(--orange-500) 0%, var(--orange-600) 100%);
      --gradient-grow:  linear-gradient(135deg, var(--teal-400) 0%, var(--teal-600) 100%);

      --text-strong: var(--ink-900);
      --text-body:   var(--ink-700);
      --text-muted:  var(--ink-500);
      --text-subtle: var(--ink-400);
      --text-on-brand: var(--white);
      --text-link:   var(--orange-600);

      --surface-page:   var(--ink-50);
      --surface-card:   var(--white);
      --surface-sunken: var(--ink-100);
      --surface-soft:   var(--ink-50);
      --surface-inverse: var(--ink-900);

      --border-subtle:  var(--ink-150);
      --border-default: var(--ink-200);
      --border-strong:  var(--ink-300);
      --border-focus:   var(--orange-500);

      --ring: 0 0 0 3px rgba(255, 122, 0, 0.28);

      /* Typography */
      --font-display: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-sans:    'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --text-2xs: 0.6875rem;
      --text-xs:  0.75rem;
      --text-sm:  0.875rem;
      --text-md:  1rem;
      --text-lg:  1.125rem;
      --text-xl:  1.375rem;
      --text-2xl: 1.75rem;
      --text-3xl: 2.25rem;
      --text-4xl: 2.875rem;
      --text-5xl: 3.75rem;

      --weight-regular: 400;
      --weight-medium:  500;
      --weight-semibold: 600;
      --weight-bold:    700;
      --weight-extrabold: 800;

      --leading-tight: 1.12;
      --leading-snug:  1.28;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;

      --tracking-tight: -0.022em;
      --tracking-snug:  -0.012em;
      --tracking-normal: 0;
      --tracking-wide:  0.04em;
      --tracking-caps:  0.08em;

      /* Spacing / radius / shadow */
      --space-0: 0;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 2.5rem;
      --space-8: 3rem;
      --space-9: 4rem;
      --space-10: 5rem;
      --space-12: 7rem;

      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-2xl: 32px;
      --radius-full: 999px;

      --shadow-xs: 0 1px 2px rgba(43, 33, 20, 0.06);
      --shadow-sm: 0 2px 6px rgba(43, 33, 20, 0.07), 0 1px 2px rgba(43, 33, 20, 0.05);
      --shadow-md: 0 6px 16px rgba(43, 33, 20, 0.08), 0 2px 4px rgba(43, 33, 20, 0.05);
      --shadow-lg: 0 14px 32px rgba(43, 33, 20, 0.10), 0 4px 8px rgba(43, 33, 20, 0.05);
      --shadow-xl: 0 28px 56px rgba(43, 33, 20, 0.14), 0 8px 16px rgba(43, 33, 20, 0.06);
      --shadow-brand: 0 10px 24px rgba(255, 122, 0, 0.30);
      --shadow-accent: 0 10px 24px rgba(18, 168, 142, 0.26);

      --container-max: 1200px;
      --container-wide: 1400px;
      --header-height: 72px;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 0.16s;
      --dur-base: 0.24s;
      --dur-slow: 0.4s;
    }

    /* Base Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: var(--font-sans);
}

.app-shell { display: flex; }
.app-main { flex: 1; min-width: 0; }

body {
  background: var(--surface-page);
  color: var(--text-body);
  min-height: 100vh;
}

/* Container */
.container {
  max-width: 960px;
  margin: 40px auto;
  padding: 0 20px;
}

/* Profile Card */
.profile-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-md);
}

/* Card header row: title + role pill */
.profile-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding-bottom: var(--space-4);
  margin-bottom: var(--space-5);
  border-bottom: 1px solid var(--border-subtle);
}

.profile-card-header h1 {
  font-family: var(--font-display);
  font-weight: var(--weight-bold);
  font-size: var(--text-2xl);
  color: var(--text-strong);
  letter-spacing: var(--tracking-tight);
  text-align: left;
}

.role-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: var(--weight-semibold);
  font-size: var(--text-xs);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  background: var(--color-info-soft);
  color: var(--sky-700);
  line-height: 1.2;
  white-space: nowrap;
}

/* Header: Avatar + Name */
.profile-header {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

.profile-avatar img {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--sky-100);
  box-shadow: var(--shadow-sm);
}

.profile-title h2 {
  font-family: var(--font-display);
  font-weight: var(--weight-bold);
  font-size: var(--text-xl);
  color: var(--text-strong);
  margin-bottom: 4px;
}

.profile-title p {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

/* Detail Sections */
.profile-details {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.detail-item {
  display: flex;
  align-items: flex-start;
  background: var(--surface-card);
  border: 1.5px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  gap: var(--space-3);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}

.detail-item:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.detail-item .material-icons {
  font-size: 24px;
  color: var(--sky-600);
  margin-top: 2px;
}

.detail-item h3 {
  margin-bottom: 4px;
  font-weight: var(--weight-semibold);
  font-size: var(--text-sm);
  color: var(--text-strong);
}

.detail-item p {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

/* Locked identity fields */
.locked-fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}

.locked-field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}

.locked-field-label span:first-child {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--ink-600);
}

.locked-pill {
  font-size: 9px;
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wide);
  color: var(--ink-400);
  background: var(--ink-100);
  padding: 2px 6px;
  border-radius: 5px;
}

.locked-field-value {
  border: 1px solid var(--border-subtle);
  background: var(--ink-100);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  font-size: var(--text-sm);
  color: var(--ink-500);
}

/* Buttons */
.profile-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

.btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-weight: var(--weight-semibold);
  font-size: var(--text-sm);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}

.btn span.material-icons {
  font-size: 18px;
}

.btn-primary {
  background: var(--brand);
  color: var(--brand-on);
}

.btn-primary:hover {
  background: var(--brand-hover);
  box-shadow: var(--shadow-brand);
}

.btn-secondary {
  background: var(--surface-card);
  color: var(--text-strong);
  border-color: var(--border-default);
}

.btn-secondary:hover {
  background: var(--surface-sunken);
}

/* Responsive Design */
@media (max-width: 900px) {
  .app-shell {
    flex-direction: column;
  }
}

@media (max-width: 640px) {
  .profile-card-header {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .profile-header {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .profile-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .btn {
    justify-content: center;
  }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Navigation will be included here -->
    <div id="nav"></div>

    <main class="app-main profile-container">
      <div class="container">
        <div class="profile-card">
          <div class="profile-card-header">
            <h1>Student Profile</h1>
            <span class="role-pill" id="profileRole">Student</span>
          </div>

          <div class="profile-header">
            <div class="profile-avatar">
              <img id="profileAvatar" src="../img/student.jpg" alt="Student Avatar">
            </div>
            <div class="profile-title">
              <h2 id="profileName">Loading...</h2>
            </div>
          </div>

          <div class="profile-details">
            <div class="detail-item">
              <span class="material-icons">email</span>
              <div>
                <h3>Email Address</h3>
                <p id="profileEmail">Loading...</p>
              </div>
            </div>

            <div class="detail-item">
              <span class="material-icons">school</span>
              <div>
                <h3>Grade Level</h3>
                <p id="gradeLevel">Not specified</p>
              </div>
            </div>

            <div class="detail-item">
              <span class="material-icons">calendar_today</span>
              <div>
                <h3>Last Login</h3>
                <p id="profileLastLogin">Loading...</p>
              </div>
            </div>

            <div class="detail-item">
              <span class="material-icons">assignment</span>
              <div>
                <h3>Assignments Submitted</h3>
                <p id="assignmentsSubmitted">0</p>
              </div>
            </div>

            <div class="detail-item">
              <span class="material-icons">grade</span>
              <div>
                <h3>Average Grade</h3>
                <p id="averageGrade">N/A</p>
              </div>
            </div>

            <!-- Populated by userProfiles/user_profile.js's populateProfile() with any
                 extra fields found in storage; display:contents so each item still
                 lays out as its own .profile-details grid cell. -->
            <div id="additionalDetailsContainer" style="display: contents;"></div>
          </div>

          <div class="locked-fields">
            <div>
              <div class="locked-field-label">
                <span>Student ID</span>
                <span class="locked-pill">LOCKED</span>
              </div>
              <div class="locked-field-value" id="profileUserId">Loading...</div>
            </div>
          </div>

          <div class="profile-actions">
            <button id="editProfileBtn" class="btn btn-primary">
              <span class="material-icons">edit</span>
              Edit Profile
            </button>
            <button id="changePasswordBtn" class="btn btn-secondary">
              <span class="material-icons">lock</span>
              Change Password
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../userProfiles/user_profile.js"></script>
</body>
</html>
