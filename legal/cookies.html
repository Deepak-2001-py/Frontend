<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradeAnt | Cookie Policy</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="legal.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="logo-container">
        <img src="../img/Designer.jpeg" alt="GradeAnt Logo" class="logo-image">
        <h1 class="logo">Grade<span>Ant</span></h1>
      </a>
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">Home</a>
        <a href="../resoures/about.html">About</a>
        <a href="../resoures/contact.html">Contact</a>
        <div class="auth-buttons">
          <a href="../auth/login.html" class="btn btn-primary">Login</a>
          <a href="../auth/signup.html" class="btn btn-secondary active">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="policy-container">
    <div class="policy-header">
      <h1>About Cookies</h1>
      <div class="policy-divider"></div>
    </div>

    <div class="policy-intro">
      <p>Our mission is to empower educators with intelligent tools that save time and improve student outcomes.</p>
    </div>
  </div>

  <!-- Back to Top Button -->
  <a href="#" class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></a>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Grade-Ant. All rights reserved.</p>
  </footer>

  <script>
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }

    // Back to top button
    const backToTopButton = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        backToTopButton.classList.add('visible');
      } else {
        backToTopButton.classList.remove('visible');
      }
    });

    backToTopButton.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
