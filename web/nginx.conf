server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Every page of the old static site -> its React route (query string kept,
  # e.g. ?qp_id=&assignment_id= deep links and ?token= invites).
  # (No rule for /index.html: the SPA fallback below redirects to it
  # internally, so a 301 there would loop.)
  location = /Gradeant_dashboard.html                   { return 301 /$is_args$args; }
  location = /auth/login.html                           { return 301 /login$is_args$args; }
  location = /auth/signup.html                          { return 301 /signup$is_args$args; }
  location = /session/logout.html                       { return 301 /logout$is_args$args; }
  location = /session/session-expired.html              { return 301 /session-expired$is_args$args; }
  location = /session/unauthorized.html                 { return 301 /unauthorized$is_args$args; }
  location = /session/multiple-login.html               { return 301 /multiple-login$is_args$args; }
  location = /quick_links/features.html                 { return 301 /features$is_args$args; }
  location = /quick_links/demo.html                     { return 301 /demo$is_args$args; }
  location = /quick_links/getstarted.html               { return 301 /get-started$is_args$args; }
  location = /resoures/about.html                       { return 301 /about$is_args$args; }
  location = /resoures/about_.html                      { return 301 /about$is_args$args; }
  location = /resoures/blog.html                        { return 301 /blog$is_args$args; }
  location = /resoures/contact.html                     { return 301 /contact$is_args$args; }
  location = /legal/privacy.html                        { return 301 /privacy$is_args$args; }
  location = /legal/terms.html                          { return 301 /terms$is_args$args; }
  location = /legal/cookies.html                        { return 301 /cookies$is_args$args; }
  location = /dashboards/student_dashboard_.html        { return 301 /student/dashboard$is_args$args; }
  location = /student/student_upload.html               { return 301 /student/upload$is_args$args; }
  location = /student/student_grade.html                { return 301 /student/grades$is_args$args; }
  location = /student/student_answer_correction.html    { return 301 /student/answer-correction$is_args$args; }
  location = /dashboards/teacher_dashboard.html         { return 301 /teacher/dashboard$is_args$args; }
  location = /teacher/teacher_upload.html               { return 301 /teacher/upload$is_args$args; }
  location = /upload_pdf.html                           { return 301 /teacher/upload$is_args$args; }
  location = /teacher/teacher_view_grade.html           { return 301 /teacher/grades$is_args$args; }
  location = /view_grades.html                          { return 301 /teacher/grades$is_args$args; }
  location = /teacher/student-details.html              { return 301 /teacher/student-details$is_args$args; }
  location = /teacher/teacher_correction.html           { return 301 /teacher/correction$is_args$args; }
  location = /teacher/teacher_question_correction.html  { return 301 /teacher/question-correction$is_args$args; }
  location = /userProfiles/student_profile.html         { return 301 /student/profile$is_args$args; }
  location = /userProfiles/teacher_profile.html         { return 301 /teacher/profile$is_args$args; }
  location = /userProfiles/user_profile.html            { return 301 /login$is_args$args; }
  location = /admin/admin_dashboard.html                { return 301 /admin/dashboard$is_args$args; }
  location = /admin/admin_users.html                    { return 301 /admin/users$is_args$args; }
  location = /admin/admin_reset_requests.html           { return 301 /admin/reset-requests$is_args$args; }
  location = /admin/admin_content.html                  { return 301 /admin/content$is_args$args; }
  location = /admin/admin_analytics.html                { return 301 /admin/analytics$is_args$args; }
  location = /admin/admin_tickets.html                  { return 301 /admin/tickets$is_args$args; }
  location = /admin/admin_audit_logs.html               { return 301 /admin/audit-logs$is_args$args; }
  location = /admin/admin_settings.html                 { return 301 /admin/settings$is_args$args; }
  location = /admin/admin_profile.html                  { return 301 /admin/profile$is_args$args; }
  location = /admin/first_login_setup.html              { return 301 /first-login$is_args$args; }

  # Client-side routing: unknown paths fall back to the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
