server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Old .html bookmarks/links -> their React routes.
  location = /index.html                            { return 301 /; }
  location = /auth/login.html                       { return 301 /login; }
  location = /auth/signup.html                      { return 301 /signup; }
  location = /dashboards/student_dashboard_.html    { return 301 /student/dashboard; }
  location = /dashboards/teacher_dashboard.html     { return 301 /teacher/dashboard; }
  location = /admin/admin_dashboard.html            { return 301 /admin/dashboard; }
  location = /admin/first_login_setup.html          { return 301 /first-login$is_args$args; }

  # Client-side routing: unknown paths fall back to the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
