<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GradeAnt: AI-Powered Homework Grader for students and teachers" />
  <title>GradeAnt: AI-Powered Homework Grader</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="../css/asthetic_style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../teacher/teacher_grade.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="../component-loader.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Navigation will be loaded here -->
    <div id="nav"></div>
    <main class="app-main">
      <main class="main-content">
        <div class="container">
          <section id="grades-section" class="tab-content active" role="tabpanel">
            <div class="card">
              <div class="card-header">
                <h2><i class="fas fa-chart-bar"></i> View Grades</h2>
              </div>
              <div class="card-body">
                <nav class="secondary-nav" aria-label="User Type Navigation">
                  <ul class="nav-tabs" role="tablist">
                    <li role="presentation">
                      <button class="tab-btn active" id="student-view-btn" data-tab="student-view" aria-selected="true">
                        <i class="fas fa-user-graduate"></i> Single Student's Assignment Info View
                      </button>
                    </li>
                  </ul>
                </nav>

                <h1>Student Assignment Details</h1>

                <div id="student-view" class="sub-tab-content active">
                  <div class="loader-container" id="student-loader-container">
                    <div class="loader" id="student-loader"></div>
                  </div>

                  <div class="result-container" id="student-result" style="display: none;">
                    <div class="score-hero" id="score-hero" hidden></div>
                    <h4>Your Assignment Summary</h4>
                    <table id="summary-table" class="summary-table">
                      <thead>
                        <tr>
                          <th>Student ID</th>
                          <th>Assignment ID</th>
                          <th>Total Marks</th>
                          <th>Evaluation ID</th>
                          <th>QP ID</th>
                          <th>Date</th>
                          <th class="actions-col">Actions</th>
                        </tr>
                      </thead>
                      <tbody id="summary-body"></tbody>
                    </table>
                    <button class="update-marks-button" onclick="handleUpdateMarks()">Update Marks</button>
                  </div>

                  <div class="questions-toolbar">
                    <h4>Question Breakdown</h4>
                    <button type="button" class="preview-toggle-btn" id="preview-toggle-btn" onclick="toggleStudentPreview()">
                      <i class="fas fa-eye"></i> Preview as Student
                    </button>
                  </div>
                  <div class="preview-banner" id="preview-banner" style="display: none;">
                    <i class="fas fa-eye"></i> Student preview — this is exactly what the student sees for this assignment (no edit controls).
                  </div>
                  <div class="q-path-nav" id="q-path-nav"></div>
                  <div class="q-count" id="q-count"></div>
                  <div id="questions-container"></div>

                  <button class="print-button" onclick="window.print()">Print</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </main>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 GradeAnt. All rights reserved.</p>
    </div>
  </footer>

  <script src="../javascript/api-cache.js"></script>
  <script src="../javascript/grade_display.js"></script>
  <script src="../javascript/student-details.js"></script>
</body>
</html>
